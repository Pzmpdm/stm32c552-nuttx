# Cortex-M33 attach only; no Flash bank or reset/initialization writes.
# AP layout: STMicroelectronics/OpenOCD openocd-cubeide-r7,
# tcl/target/stm32c5x.cfg (AP0 system access, AP1 Cortex-M33).
source [find interface/stlink-dap.cfg]
transport select dapdirect_swd
adapter speed 100
adapter serial 02660247523100063638414B
source [find target/swj-dp.tcl]
swj_newdap stm32c552 cpu -irlen 4 -ircapture 0x1 -irmask 0xf -expected-id 0x6ba02477
dap create stm32c552.dap -chain-position stm32c552.cpu
target create stm32c552.cpu cortex_m -endian little -dap stm32c552.dap -ap-num 1
bindto 127.0.0.1
gdb_port 3333
telnet_port disabled
tcl_port disabled
